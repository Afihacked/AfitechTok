name: Auto Release

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Move Keystore
        run: mkdir -p app/keystore && mv keystore.jks app/keystore/

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build Signed APK
        run: ./gradlew assembleRelease
        env:
          STORE_FILE: app/keystore/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate changelog
        id: changelog
        run: |
          echo "🚀 AfitechTok ${{ github.ref_name }}" > CHANGELOG.txt
          echo "" >> CHANGELOG.txt
          
          echo "✨ Fitur:" >> CHANGELOG.txt
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD --pretty=format:"%s" | grep "^feat:" | sed 's/^feat:/-/' >> CHANGELOG.txt || true
          
          echo "" >> CHANGELOG.txt
          echo "🐛 Perbaikan:" >> CHANGELOG.txt
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD --pretty=format:"%s" | grep "^fix:" | sed 's/^fix:/-/' >> CHANGELOG.txt || true
          
          echo "" >> CHANGELOG.txt
          echo "⚡ Peningkatan:" >> CHANGELOG.txt
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD --pretty=format:"%s" | grep "^perf:" | sed 's/^perf:/-/' >> CHANGELOG.txt || true
          
          echo "" >> CHANGELOG.txt
          echo "📦 Build:" >> CHANGELOG.txt
          echo "- commit: ${{ github.sha }}" >> CHANGELOG.txt

      - name: Upload Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: CHANGELOG.txt